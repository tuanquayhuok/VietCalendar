name: Build iOS IPA

on:
  push:
    paths:
      - 'VietCalendar/**'
      - 'project.yml'
      - '.github/workflows/build_ipa.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project & Build Archive
        run: |
          xcodegen generate
          
          xcodebuild archive \
            -project VietCalendar.xcodeproj \
            -scheme VietCalendar \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/VietCalendar.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into Signed-Ready IPA
        run: |
          mkdir -p build/Payload
          cp -r build/VietCalendar.xcarchive/Products/Applications/VietCalendar.app build/Payload/
          
          # Fix POSIX permissions for 3uTools & Sideloadly compatibility
          chmod -R 755 build/Payload/VietCalendar.app
          
          cd build
          zip -r9 ../VietCalendar.ipa Payload/
          cd ..
          ls -la VietCalendar.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietCalendar-IPA
          path: VietCalendar.ipa
          retention-days: 14
