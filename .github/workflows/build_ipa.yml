name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Compile Application with Swift Toolchain
        run: |
          mkdir -p build/Payload/VietCalendar.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          SWIFT_FILES=$(find VietCalendar -name "*.swift")
          echo "Compiling Swift files..."
          
          xcrun swiftc \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            $SWIFT_FILES \
            -o build/Payload/VietCalendar.app/VietCalendar
          
          # Copy Info.plist
          cp VietCalendar/Info.plist build/Payload/VietCalendar.app/Info.plist
          
          # Copy all direct AppIcon PNGs into App Bundle root
          if [ -d "VietCalendar/Resources/Icons" ]; then
            cp VietCalendar/Resources/Icons/*.png build/Payload/VietCalendar.app/
          fi
          
          # Compile Assets Catalog to Assets.car
          if [ -d "VietCalendar/Resources/Assets.xcassets" ]; then
            xcrun actool VietCalendar/Resources/Assets.xcassets \
              --compile build/Payload/VietCalendar.app \
              --platform iphoneos \
              --minimum-deployment-target 17.0 \
              --app-icon AppIcon \
              --output-format human-readable-text || true
          fi
          
          # Sign binary with local Ad-Hoc signature
          codesign -s - --force --deep build/Payload/VietCalendar.app

      - name: Create IPA Package
        run: |
          cd build
          zip -qr VietCalendar.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietCalendar-IPA
          path: build/VietCalendar.ipa
