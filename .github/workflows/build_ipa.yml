name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project VietCalendar.xcodeproj \
            -scheme VietCalendar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/VietCalendar.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload and Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/VietCalendar.xcarchive/Products/Applications/VietCalendar.app build/Payload/
          cd build
          zip -r VietCalendar.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietCalendar-IPA
          path: build/VietCalendar.ipa
