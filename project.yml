name: VietCalendar
options:
  bundleIdPrefix: com.vietcalendar
  deploymentTarget:
    iOS: 17.0
  xcodeVersion: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: 'NO'
    CODE_SIGNING_REQUIRED: 'NO'
    CODE_SIGN_IDENTITY: ''

targets:
  VietCalendar:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: VietCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vietcalendar.app
        INFOPLIST_KEY_CFBundleDisplayName: "Lịch Việt"
        INFOPLIST_KEY_CFBundleName: "VietCalendar"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
