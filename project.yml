name: VietCalendar
options:
  bundleIdPrefix: com.vietcalendar
  deploymentTarget:
    iOS: '17.0'

targets:
  VietCalendar:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: VietCalendar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vietcalendar.app
        INFOPLIST_KEY_CFBundleDisplayName: "Lịch Việt"
        INFOPLIST_KEY_CFBundleName: "VietCalendar"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        AD_HOC_CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""

schemes:
  VietCalendar:
    build:
      targets:
        VietCalendar: all
